objects_tracker_node:
  ros__parameters:
    target_frame: odom
    visualize: true
    publish_filtered_pcl: true

    cluster:
      neighbor_radius: 0.6
      min_points: 15

    enable_static_bg_subtraction: true
    static_bg_subtractor:
      resolution: 0.05
      # With threshold = 0.7, scan freq = 10 Hz
      # Let it take 10 seconds to adapt to a new static object -> 0.7/(10*10) = 0.007
      # Let it take 10 seconds to forget a removed static object -> (1-0.7)/(10*10) = 0.003
      hit_increment: 0.007
      miss_decrement: 0.003
      threshold: 0.7
      publish_grid: true
      grid_size: 15.0
      initialize_with_first_scan: true
      inflation_radius: 1

    enable_radius_outlier_removal: true
    radius_outlier_removal:
      min_points: 15   # minimum neighbours required within radius to keep a point
      radius: 0.2     # search radius in metres

    lmb_tracker:
      max_dt: 1.0
      gate_threshold: 6.0
      birth_existence_prob: 0.05
      death_existence_prob: 0.01
      survival_prob: 0.97
      detection_prob: 0.8
      clutter_intensity: 1.0
      confirmation_existence_prob: 0.5
      merge_distance: 0.01
      max_position_variance: 1.5

    kalman_filter:
      pos_uncertainty: 0.2
      vel_uncertainty: 0.6
      acc_uncertainty: 1.0
